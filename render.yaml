services:
  - type: web
    name: ember-server
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # you paste your Supabase connection string in the Render dashboard
      - key: SUPABASE_URL
        sync: false   # e.g. https://abcdxyz.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false   # the public anon / publishable key
