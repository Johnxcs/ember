name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_LOG: ${{ github.workspace }}/build.log

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # bash runs with pipefail, so a failing command still fails the step after "| tee"
    steps:
      - uses: actions/checkout@v4

      - name: Start build.log
        run: |
          {
            echo "== Ember build $(date -u) =="
            echo "-- repo files --"; ls -la; echo "-- app/ --"; ls -la app app/src-tauri 2>&1 || true
          } 2>&1 | tee "$BUILD_LOG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK + platform
        run: |
          {
            sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          } 2>&1 | tee -a "$BUILD_LOG"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2 2>&1 | tee -a "$BUILD_LOG"

      - name: Generate app icons
        working-directory: app
        run: |
          {
            convert -size 1024x1024 xc:'#ff6b35' icon.png
            tauri icon icon.png
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Init Android project
        working-directory: app
        run: tauri android init 2>&1 | tee -a "$BUILD_LOG"

      - name: Allow ws:// (cleartext) connections
        run: |
          M=app/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$M" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$M"

      - name: Build APK (debug-signed, installable)
        working-directory: app
        run: tauri android build --apk --debug --target aarch64 -v 2>&1 | tee -a "$BUILD_LOG"

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/src-tauri/gen/android -name "*.apk" -exec cp {} dist/ember.apk \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ember-apk
          path: dist/ember.apk

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ember.apk

      # ---- only when something above failed ----
      - name: Show end of build.log in the run summary
        if: failure()
        run: |
          echo '### Build failed - last 150 lines of build.log' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 "$BUILD_LOG" >> "$GITHUB_STEP_SUMMARY" || echo "no build.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
